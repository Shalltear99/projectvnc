; CloudJava VNC — worker process supervision
; Every component of the graphical stack is supervised: if Xtigervnc dies the
; desktop is useless, so the whole tree is restarted together.
[supervisord]
nodaemon=true
; No `user=` directive: the container already runs as uid 1000 via USER in the
; Dockerfile. Setting it here would make supervisord try to setuid as non-root
; and refuse to start.
pidfile=/home/cloudjava/var/run/supervisord.pid
logfile=/home/cloudjava/var/log/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
loglevel=info

[unix_http_server]
file=/home/cloudjava/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/cloudjava/var/run/supervisor.sock

; ---------------------------------------------------------------- X / VNC ----
[program:xvnc]
command=/usr/bin/Xtigervnc %(ENV_DISPLAY)s
    -geometry %(ENV_SCREEN_W)sx%(ENV_SCREEN_H)s
    -depth %(ENV_SCREEN_DEPTH)s
    -rfbport %(ENV_VNC_PORT)s
    -rfbauth /home/cloudjava/.vnc/passwd
    -SecurityTypes VncAuth
    -localhost
    -nolisten tcp
    -AlwaysShared
    -BlacklistThreshold 10000
    -BlacklistTimeout 5
priority=10
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/home/cloudjava/var/log/xvnc.log
stderr_logfile=/home/cloudjava/var/log/xvnc.err.log

; ------------------------------------------------------------- Window mgr ----
[program:openbox]
command=/usr/bin/openbox --config-file /etc/xdg/openbox/rc.xml
priority=20
autorestart=true
startsecs=1
environment=DISPLAY="%(ENV_DISPLAY)s",XAUTHORITY="/home/cloudjava/.Xauthority"
stdout_logfile=/home/cloudjava/var/log/openbox.log
stderr_logfile=/home/cloudjava/var/log/openbox.err.log

; --------------------------------------------------------------- Game app ----
[program:game]
command=/usr/local/bin/run-game.sh
priority=30
autorestart=false
startsecs=0
environment=DISPLAY="%(ENV_DISPLAY)s",XAUTHORITY="/home/cloudjava/.Xauthority"
stdout_logfile=/home/cloudjava/var/log/game.log
stderr_logfile=/home/cloudjava/var/log/game.err.log

; --------------------------------------------- Scale game to the desktop ----
; FreeJ2ME opens at scaleFactor 1, which leaves the game in a 250x375 window on
; a 1280x720 desktop. This resizes it to the largest size that keeps the game's
; aspect ratio (so no white LCD letterbox) and re-fits when the desktop changes.
[program:fit-window]
command=/usr/local/bin/fit-window.sh
priority=34
autorestart=true
startsecs=1
environment=DISPLAY="%(ENV_DISPLAY)s",XAUTHORITY="/home/cloudjava/.Xauthority",WINDOW_NAME="%(ENV_GAME_WINDOW_NAME)s",GAME_ASPECT="%(ENV_GAME_ASPECT)s"
stdout_logfile=/home/cloudjava/var/log/fit-window.log
stderr_logfile=/home/cloudjava/var/log/fit-window.err.log

; ------------------------------------------------- Keep window centred ----
[program:center-windows]
command=/usr/local/bin/center-windows.sh
priority=35
autorestart=true
startsecs=1
environment=DISPLAY="%(ENV_DISPLAY)s",XAUTHORITY="/home/cloudjava/.Xauthority"
stdout_logfile=/home/cloudjava/var/log/center-windows.log
stderr_logfile=/home/cloudjava/var/log/center-windows.err.log

; ------------------------------------------------------ RFB -> WebSocket ----
[program:websockify]
command=/usr/local/bin/websockify
    --web=/usr/share/novnc
    --heartbeat=30
    %(ENV_WS_PORT)s
    127.0.0.1:%(ENV_VNC_PORT)s
priority=40
autorestart=true
startsecs=1
stdout_logfile=/home/cloudjava/var/log/websockify.log
stderr_logfile=/home/cloudjava/var/log/websockify.err.log
