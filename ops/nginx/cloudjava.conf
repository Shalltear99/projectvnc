###############################################################################
# CloudJava VNC — edge reverse proxy (docs/architecture.md §2.1, security.md §2)
#
# Responsibilities:
#   * TLS termination for the dashboard and every VNC stream
#   * WSS upgrade for /vnc-stream/<instanceId> -> 127.0.0.1:<ws_port>
#   * keep RFB (5900-6000) unreachable from the internet, always
#
# The instanceId -> port table is a generated `map` include; nginx cannot add
# upstreams at runtime, so ProvisionerAgent rewrites the file and reloads.
###############################################################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Extracted from /vnc-stream/<id>/websockify — the first path segment after the
# prefix is the instance id.
map $uri $cloudjava_instance_id {
    default "";
    "~^/vnc-stream/(?<cj_id>[0-9a-zA-Z-]+)" $cj_id;
}

# Generated by ProvisionerAgent. Must exist before nginx starts: ship the empty
# stub in this directory (see cloudjava_upstreams.map).
include /etc/nginx/conf.d/cloudjava_upstreams.map;

upstream cloudjava_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream cloudjava_dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── HTTP: only used for ACME challenges and the redirect ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vnc.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Liveness probe answered on plain HTTP so the healthcheck does not depend on
    # a valid certificate (during first boot none exists yet).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: dashboard + API ───────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Deliberately HTTP/1.1 only: a VNC session is one long-lived WebSocket, so
    # multiplexing buys nothing, and `http2 on;` is unavailable before nginx
    # 1.25 (the host may run an older distro build).
    server_name vnc.example.com;

    ssl_certificate     /etc/letsencrypt/live/vnc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vnc.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CloudJavaTLS:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. The dashboard embeds noVNC from its own origin, so
    # frame-ancestors 'self' is enough; no third-party framing is allowed.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 2m;

    # Unauthenticated liveness probe used by the compose healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── REST API ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://cloudjava_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 30s;
    }

    # ── VNC stream (WSS) ─────────────────────────────────────────────────────
    # websockify expects the handshake on /websockify, but the browser must be
    # able to address a specific instance. The prefix is rewritten away so the
    # upstream sees a stable path regardless of the instance id.
    location ~ ^/vnc-stream/(?<instance_id>[0-9a-zA-Z-]+) {
        # Port 0 means "unknown or not running": refuse rather than risk
        # proxying into an unrelated service that happens to hold that port.
        if ($cloudjava_upstream_port = 0) {
            return 404;
        }

        # The stream URL carries a short-lived HMAC ticket (docs/tasks.md 3.2).
        # Without this, knowing an instance id would be enough to attach to
        # somebody else's desktop.
        auth_request /_vnc_authorize;

        rewrite ^/vnc-stream/[^/]+(/.*)?$ /websockify break;
        proxy_pass http://127.0.0.1:$cloudjava_upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # A remote desktop is a long-lived duplex stream: no buffering, no
        # short read timeout, and TCP_NODELAY so keystrokes are not coalesced.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;

        # Per-IP cap on simultaneous streams (docs/prd.md 5.1)
        limit_conn cloudjava_streams 4;
    }

    # Internal subrequest: validates the ticket before any bytes are proxied.
    location = /_vnc_authorize {
        internal;
        proxy_pass http://cloudjava_api/api/vnc/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── noVNC static assets ──────────────────────────────────────────────────
    location /novnc/ {
        proxy_pass http://cloudjava_dashboard;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── dashboard ────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://cloudjava_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}