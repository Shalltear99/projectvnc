# CloudJava VNC — main nginx config (used by the container in ops/docker-compose.yml)
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log the instance id and upgrade state: indispensable when a stream fails
    # and the user only reports "it does not connect".
    log_format cloudjava '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'inst=$cloudjava_instance_id up=$cloudjava_upstream_port '
                         'upgrade=$http_upgrade rt=$request_time';
    access_log /var/log/nginx/access.log cloudjava;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Slowloris / connection-flood protection
    client_body_timeout   15s;
    client_header_timeout 15s;
    reset_timedout_connection on;

    limit_conn_zone $binary_remote_addr zone=cloudjava_streams:10m;
    limit_req_zone  $binary_remote_addr zone=cloudjava_api:10m rate=30r/s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
